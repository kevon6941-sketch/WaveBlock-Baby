<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#bfeee8">
<title>消波塊寶寶 v2.0</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main class="app">
  <header><div><b>🌊 消波塊寶寶</b><small>WaveBlock Baby</small></div><strong id="day">DAY 1</strong></header>
  <section class="device">
    <div class="screen" id="screen">
      <img class="bg" id="bg" src="assets/backgrounds/coast-day.svg" alt="">
      <img class="animal turtle" id="turtle" src="assets/animals/turtle.svg" alt="">
      <img class="npc fisher" id="fisher" src="assets/npc/fisher.svg" alt="">
      <img class="npc worker" id="worker" src="assets/npc/worker.svg" alt="">
      <img class="npc guard" id="guard" src="assets/npc/coastguard.svg" alt="">
      <img class="pet" id="pet" src="assets/pet/waveblock-happy.svg" alt="消波塊寶寶">
      <div class="fx" id="fx"></div>
      <div class="tag" id="tag"></div>
      <div class="speech" id="speech">小波：「今天的海風好舒服～」</div>
    </div>
    <div class="stats">
      <div>🍙 飽足 <b id="hungerN"></b><i><em id="hungerB"></em></i></div>
      <div>😊 心情 <b id="happyN"></b><i><em id="happyB"></em></i></div>
      <div>✨ 清潔 <b id="cleanN"></b><i><em id="cleanB"></em></i></div>
      <div>🔧 耐久 <b id="durN"></b><i><em id="durB"></em></i></div>
    </div>
    <nav id="menu"></nav>
    <div class="keys">
      <button id="A">A<span>選擇</span></button>
      <button id="B">B<span>確定</span></button>
      <button id="C">C<span>返回</span></button>
    </div>
  </section>
  <footer>v2.0 · 自動存檔 · GitHub Pages</footer>
</main>
<div class="modal" id="modal"><article><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="closeModal">關閉</button></article></div>
<div class="toast" id="toast"></div>
<script src="js/state.js"></script>
<script src="js/events.js"></script>
<script src="js/game.js"></script>
</body>
</html>
