ition:absolute;width:16px;height:9px;border:3px solid #173d48;border-top:0;border-radius:0 0 18px 18px;left:15px;top:15px}.cheek{position:absolute;width:11px;height:6px;border-radius:50%;background:#e68f80aa;top:14px}.cheek.c1{left:-4px}.cheek.c2{right:-4px}.cracks{display:none;position:absolute;z-index:5;left:67px;top:28px;width:30px;height:55px;border-left:3px solid #4e5552;transform:rotate(22deg)}.cracks:after,.cracks:before{content:"";position:absolute;width:17px;border-top:3px solid #4e5552;left:-2px}.cracks:before{top:18px;transform:rotate(-45deg)}.cracks:after{top:35px;transform:rotate(40deg)}.pet.damaged .cracks{display:block}.pet.sleep .eye{height:2px;border-radius:0;top:6px}.pet.sleep .mouth{width:9px;height:9px;border:2px solid #173d48;border-radius:50%;left:18px;top:16px}.zzz{display:none;position:absolute;left:63%;bottom:37%;z-index:12;font-weight:900;font-size:24px;animation:float 2s infinite}.night .zzz{display:block}.fisher{display:none;position:absolute;z-index:12;left:51%;bottom:38%;width:54px;height:94px;transform:translateX(-50%)}.fisher .head{position:absolute;width:24px;height:24px;border-radius:50%;background:#e8b58c;left:8px;top:8px;border:2px solid #294c55}.fisher .hat{position:absolute;width:38px;height:10px;background:#e8bd52;border:2px solid #294c55;border-radius:50%;top:3px;left:1px}.fisher .body{position:absolute;width:28px;height:38px;background:#4f8b77;border:2px solid #294c55;left:6px;top:30px;border-radius:8px}.fisher .rod{position:absolute;width:3px;height:80px;background:#614b3a;left:35px;top:17px;transform:rotate(35deg);transform-origin:bottom}.fisher .rod:after{content:"";position:absolute;width:1px;height:74px;background:#d9f5ef;top:-1px;left:2px;transform:rotate(-8deg);transform-origin:top}.night .fisher{display:block}.turtle{position:absolute;z-index:5;top:61%;left:-70px;width:58px;height:31px;animation:swim 11s linear infinite}.turtle .shell{position:absolute;width:37px;height:26px;border-radius:50%;background:#65a86d;border:3px solid #285b54;left:10px}.turtle .head{position:absolute;width:16px;height:14px;border-radius:50%;background:#8acb7d;right:0;top:6px;border:2px solid #285b54}.worker{display:none;position:absolute;z-index:14;left:20%;bottom:19%;width:52px;height:85px}.repairing .worker{display:block;animation:work .6s ease-in-out infinite alternate}.worker .helmet{position:absolute;width:32px;height:14px;border-radius:20px 20px 4px 4px;background:#ffd43d;border:2px solid #294c55;left:8px}.worker .head{position:absolute;width:25px;height:23px;border-radius:50%;background:#e6b58c;border:2px solid #294c55;left:11px;top:10px}.worker .body{position:absolute;width:34px;height:39px;background:#ef8d43;border:2px solid #294c55;left:7px;top:31px;border-radius:7px}.worker:after{content:"🔧";position:absolute;font-size:23px;right:-8px;top:38px}.hud{position:absolute;z-index:30;top:10px;left:10px;right:10px;display:flex;gap:6px}.meter{flex:1;background:#ffffffcc;border:2px solid #173d48;border-radius:12px;padding:3px 5px;font-size:10px;font-weight:800}.bar{height:5px;background:#d8e3dc;border-radius:5px;overflow:hidden;margin-top:2px}.fill{height:100%;background:#4a9f78;transition:.3s}.dialog{position:absolute;z-index:40;left:8%;right:8%;bottom:4%;min-height:54px;background:#fff9ddee;border:3px solid #173d48;border-radius:18px;padding:9px 13px;text-align:center;font-size:14px;font-weight:800;box-shadow:0 4px #173d4830}.icons{display:flex;gap:6px;justify-content:center;padding:12px 2px 8px}.icon{width:43px;height:43px;border:2px solid #173d48;border-radius:13px;background:#fff6cf;display:grid;place-items:center;font-size:22px;opacity:.55;transition:.2s}.icon.sel{opacity:1;transform:translateY(-5px);background:#fff;border-width:3px;box-shadow:0 5px #d49d35}.buttons{display:flex;justify-content:center;gap:22px;padding:6px 0 8px}.btn{width:78px;height:78px;border-radius:50%;border:5px solid #173d48;background:linear-gradient(#ffbf4b,#ed9534);box-shadow:0 7px #17404a;display:grid;place-items:center;font-size:28px;font-weight:1000;color:#173d48;touch-action:manipulation;user-select:none}.btn:active,.btn.pressed{transform:translateY(6px);box-shadow:0 1px #17404a}.labels{display:flex;justify-content:center;gap:48px;font-size:11px;font-weight:900;margin-top:-2px}.footer{text-align:center;font-size:10px;opacity:.7;padding:4px}.night .sky{background:linear-gradient(#163d69,#375c82)}.night .sun{background:#fff3bd;box-shadow:8px -5px 0 0 #163d69}.night .sea{filter:brightness(.65)}.night .shore{filter:brightness(.7)}.night .cloud{opacity:.25}.night .boat{filter:brightness(.7)}
@keyframes wave{to{transform:translateX(36px)}}@keyframes bob{50%{transform:translate(-50%,-5px) rotate(1deg)}}@keyframes boat{50%{transform:translateY(5px) rotate(2deg)}}@keyframes float{to{transform:translate(18px,-30px);opacity:0}}@keyframes swim{to{left:110%}}@keyframes work{to{transform:rotate(-4deg)}}@media(max-height:700px){.device{width:min(84vw,380px);padding:10px}.screen{max-height:58vh}.btn{width:62px;height:62px}.icons{padding:7px 2px 4px}.brand{padding-bottom:5px}}
</style></head><body><main class="device" id="device"><div class="brand"><b>🌊 消波塊寶寶</b><span class="day" id="day">DAY 1</span></div><section class="screen" id="screen"><div class="sky"><i class="sun"></i><i class="cloud"></i></div><div class="hills"></div><div class="lighthouse"></div><div class="boat"></div><div class="sea"><div class="wave"></div><div class="wave w2"></div><div class="turtle"><i class="shell"></i><i class="head"></i></div></div><div class="shore"></div><div class="rocks"></div><div class="hud"><div class="meter">🍙 飽足<div class="bar"><div class="fill" id="hungerBar"></div></div></div><div class="meter">♥ 心情<div class="bar"><div class="fill" id="happyBar"></div></div></div><div class="meter">◆ 耐久<div class="bar"><div class="fill" id="durBar"></div></div></div></div><div class="fisher"><i class="hat"></i><i class="head"></i><i class="body"></i><i class="rod"></i></div><div class="worker"><i class="helmet"></i><i class="head"></i><i class="body"></i></div><div class="pet" id="pet"><i class="limb l1"></i><i class="limb l2"></i><i class="limb l3"></i><i class="limb l4"></i><i class="core"></i><div class="face"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><i class="cheek c1"></i><i class="cheek c2"></i></div><i class="cracks"></i></div><div class="zzz">Z z</div><div class="dialog" id="dialog">小波今天也在守護海岸！</div></section><div class="icons" id="icons"></div><div class="buttons"><button class="btn" data-key="A">A</button><button class="btn" data-key="B">B</button><button class="btn" data-key="C">C</button></div><div class="labels"><span>選擇</span><span>確定</span><span>返回</span></div><div class="footer">COLOR COAST PET · v0.4</div></main><script>
(()=>{'use strict';const KEY='waveblock_v04';const actions=[['🍙','餵食'],['🫧','清潔'],['🌙','睡覺'],['🎣','釣魚'],['🌊','抗浪'],['🔧','修補'],['🎒','材料'],['📊','狀態']];let s={day:1,sel:0,hunger:78,happy:82,dur:100,clean:86,night:false,materials:3,fish:0,damaged:false};try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}const $=q=>document.querySelector(q),screen=$('#screen'),pet=$('#pet'),dialog=$('#dialog'),icons=$('#icons');function save(){localStorage.setItem(KEY,JSON.stringify(s))}function clamp(v){return Math.max(0,Math.min(100,v))}function say(t){dialog.textContent=t}function render(){icons.innerHTML=actions.map((a,i)=>`<div class="icon ${i===s.sel?'sel':''}" title="${a[1]}">${a[0]}</div>`).join('');$('#day').textContent=`DAY ${s.day}`;$('#hungerBar').style.width=s.hunger+'%';$('#happyBar').style.width=s.happy+'%';$('#durBar').style.width=s.dur+'%';screen.classList.toggle('night',s.night);pet.classList.toggle('sleep',s.night);pet.classList.toggle('damaged',s.damaged);save()}function act(){const name=actions[s.sel][1];if(name==='餵食'){s.hunger=clamp(s.hunger+18);s.happy=clamp(s.happy+4);say('小波：好吃！今天是海鹽飯糰～')}else if(name==='清潔'){s.clean=100;s.happy=clamp(s.happy+3);say('沖洗完成！水泥皮膚亮晶晶 ✨')}else if(name==='睡覺'){s.night=!s.night;if(!s.night){s.day++;s.hunger=clamp(s.hunger-10);s.happy=clamp(s.happy-3);say('早安！海風吹起來了。')}else say('夜深了…老釣友又悄悄站上來釣魚。')}else if(name==='釣魚'){s.fish++;s.happy=clamp(s.happy+8);say(Math.random()<.25?'釣到塑膠瓶！帶回去做淨灘回收。':`釣到第 ${s.fish} 尾魚！小波超開心。`)}else if(name==='抗浪'){if(Math.random()<.38){s.dur=clamp(s.dur-24);s.damaged=true;s.happy=clamp(s.happy-8);say('轟！浪裡的石頭撞到了小波，出現裂縫！')}else{ s.happy=clamp(s.happy+5);say('漂亮擋下大浪！抗浪成功！')}}else if(name==='修補'){if(!s.damaged){say('目前沒有需要修補的裂縫。')}else if(s.materials<1){say('修補材料不足，先去收集材料吧！')}else{s.materials--;screen.classList.add('repairing');say('施工師傅正在清理裂縫、填補修補砂漿…');setTimeout(()=>{s.dur=100;s.damaged=false;screen.classList.remove('repairing');say('修補完成！小波留下了一道勇敢的淡淡痕跡。');render()},1700)}}else if(name==='材料'){say(`修補材料 × ${s.materials} ｜ 漁獲 × ${s.fish}`)}else if(name==='狀態'){say(`飽足 ${s.hunger}｜心情 ${s.happy}｜清潔 ${s.clean}｜耐久 ${s.dur}`)}render()}function key(k){if(k==='A'){s.sel=(s.sel+1)%actions.length;say(`${actions[s.sel][0]} ${actions[s.sel][1]}`);render()}else if(k==='B')act();else{say('小波：今天也一起看看海吧～');s.sel=0;render()}}document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pressed');key(b.dataset.key)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('pressed')))});document.addEventListener('keydown',e=>{if(['a','b','c'].includes(e.key.toLowerCase()))key(e.key.toUpperCase())});render();})();
</script></body></html>
