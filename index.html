<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>消波塊寶寶 v0.3</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#c9f5f2,#eafff8);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#173d47}.wrap{max-width:480px;margin:auto;padding:16px 12px 34px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:22px;margin:8px 4px}.device{background:#ffeaa0;border:7px solid #173d47;border-radius:42px;padding:15px;box-shadow:0 14px 0 #83c8c3}.screen{position:relative;height:455px;overflow:hidden;border:7px solid #173d47;border-radius:28px;background:linear-gradient(#79d6f2 0 53%,#25a9ce 53% 72%,#e5c77e 72%);isolation:isolate}.sun{position:absolute;left:35px;top:35px;font-size:43px;animation:bob 3s infinite}.cloud{position:absolute;top:45px;right:70px;font-size:30px}.lighthouse{position:absolute;right:25px;top:104px;width:31px;height:95px;background:repeating-linear-gradient(#fff 0 18px,#f05a4f 18px 36px);border:3px solid #173d47;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.lighthouse:before{content:"";position:absolute;width:35px;height:15px;background:#173d47;left:-5px;top:-12px}.boat{position:absolute;left:38px;top:190px;font-size:34px;animation:boat 6s linear infinite}.waves{position:absolute;top:236px;left:0;width:200%;font-size:30px;letter-spacing:8px;color:#fff;animation:wave 4s linear infinite}.turtleNpc{position:absolute;right:40px;top:275px;font-size:40px;animation:swim 8s ease-in-out infinite}.fisherNpc{position:absolute;right:32px;bottom:90px;font-size:55px;transition:.5s;z-index:7}.fisherNpc.hide,.workerNpc.hide{opacity:0;transform:translateX(90px)}.workerNpc{position:absolute;left:22px;bottom:80px;font-size:52px;z-index:8;transition:.4s}.waveBaby{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:150px;height:125px;z-index:5;animation:breathe 2.4s ease-in-out infinite}.tetra-core{position:absolute;left:37px;top:24px;width:78px;height:78px;background:linear-gradient(145deg,#f2eee2,#b8b4a8);border:4px solid #4b5a5d;border-radius:42% 45% 38% 40%;box-shadow:inset -9px -9px 0 #a7a399}.leg{position:absolute;width:56px;height:49px;background:#c8c4b8;border:4px solid #4b5a5d;border-radius:45%}.l1{left:5px;top:55px;transform:rotate(-28deg)}.l2{right:5px;top:55px;transform:rotate(28deg)}.l3{left:48px;top:0;transform:rotate(5deg)}.face{position:absolute;z-index:4;left:55px;top:53px;font-size:28px;white-space:nowrap}.cheek{color:#ef7f76}.crackLayer{display:none;position:absolute;z-index:6;left:63px;top:31px;font-size:45px;color:#555;transform:rotate(15deg)}.damaged .crackLayer{display:block}.sleeping .face{font-size:0}.sleeping .face:after{content:"－ ᴗ － 💤";font-size:22px}.msg{position:absolute;left:18px;right:18px;bottom:8px;background:#fffde8e8;border:3px solid #173d47;border-radius:18px;padding:8px;text-align:center;font-weight:800;z-index:10}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 2px}.stat{background:#fff8d8;border-radius:14px;padding:9px;font-weight:700}.bar{height:9px;background:#d6d1bd;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#41b978}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.icon{background:#fff8dc;border:3px solid transparent;border-radius:15px;text-align:center;padding:9px 3px;font-size:25px;min-height:67px}.icon small{display:block;font-size:11px;font-weight:800;margin-top:3px}.icon.sel{border-color:#f29d35;background:#fff}.buttons{display:flex;justify-content:space-around;margin:18px 5px 4px}.btn{width:88px;height:88px;border-radius:50%;border:6px solid #173d47;background:#ffb63e;color:#1679c8;font-size:34px;font-weight:1000;box-shadow:inset 0 -7px #e6922b}.btn span{display:block;font-size:11px}.btn:active{transform:translateY(4px);box-shadow:inset 0 -2px #e6922b}.foot{text-align:center;color:#55777b;margin-top:18px;font-size:13px}@keyframes breathe{50%{transform:translateX(-50%) translateY(-5px) scale(1.02)}}@keyframes wave{to{transform:translateX(-50%)}}@keyframes boat{50%{transform:translateX(180px)}}@keyframes bob{50%{transform:translateY(6px)}}@keyframes swim{50%{transform:translateX(-180px) translateY(10px)}}
.night .screen{background:linear-gradient(#123a69 0 53%,#0b5b83 53% 72%,#6b6b62 72%)}.night .sun{filter:grayscale(1)}.night .sun:after{content:"🌙";position:absolute;left:0}.night .sun{font-size:0}.night .sun:after{font-size:43px}.night .cloud{opacity:.35}
</style></head><body><div class="wrap" id="app"><div class="top"><div>🌊 消波塊寶寶</div><div id="day">DAY 1</div></div><div class="device"><div class="screen"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="lighthouse" title="lighthouse"></div><div class="boat">⛴️</div><div class="waves">～～～～～～～～～～～～～～～～</div><div class="turtleNpc" id="turtleNpc">🐢</div><div class="fisherNpc hide" id="fisherNpc">🎣🧑</div><div class="workerNpc hide" id="workerNpc">👷</div><div class="waveBaby" id="waveBaby"><div class="leg l1"></div><div class="leg l2"></div><div class="leg l3"></div><div class="tetra-core"></div><div class="face"><span>•ᴗ•</span><span class="cheek">♥</span></div><div class="crackLayer" id="crackLayer">ϟ</div></div><div class="msg" id="msg">小波正在海邊發呆～</div></div><div class="hud"><div class="stat">🍙 飽足 <b id="hungerN">80</b><div class="bar"><div class="fill" id="hunger" style="width:80%"></div></div></div><div class="stat">😊 心情 <b id="moodN">85</b><div class="bar"><div class="fill" id="mood" style="width:85%"></div></div></div><div class="stat">✨ 清潔 <b id="cleanN">75</b><div class="bar"><div class="fill" id="clean" style="width:75%"></div></div></div><div class="stat">🔧 耐久 <b id="durN">100</b><div class="bar"><div class="fill" id="dur" style="width:100%"></div></div></div></div><div class="menu" id="menu"></div><div class="buttons"><button class="btn" onclick="pressA()">A<span>選擇</span></button><button class="btn" onclick="pressB()">B<span>確定</span></button><button class="btn" onclick="pressC()">C<span>返回</span></button></div></div><div class="foot">自動存檔・手機版 Prototype v0.3 Visual</div></div><script>
const KEY='wavebaby-v03';const actions=[['🍙','餵食'],['🧼','清潔'],['🎣','釣魚'],['🌊','抗浪'],['🔧','修補'],['🌙','睡眠'],['🎒','倉庫'],['📊','狀態']];let s={sel:0,hunger:80,mood:85,clean:75,dur:100,night:false,damaged:false,materials:3};try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function say(x){document.getElementById('msg').textContent=x}function render(){menu.innerHTML=actions.map((a,i)=>`<div class="icon ${i===s.sel?'sel':''}">${a[0]}<small>${a[1]}</small></div>`).join('');[['hunger',s.hunger],['mood',s.mood],['clean',s.clean],['dur',s.dur]].forEach(([k,v])=>{document.getElementById(k).style.width=v+'%';document.getElementById(k+'N').textContent=v});app.classList.toggle('night',s.night);waveBaby.classList.toggle('sleeping',s.night);waveBaby.classList.toggle('damaged',s.damaged);fisherNpc.classList.toggle('hide',!s.night);save()}
function pressA(){s.sel=(s.sel+1)%actions.length;say('選擇：'+actions[s.sel][1]);render()}
function pressB(){const a=actions[s.sel][1];if(a==='餵食'){s.hunger=Math.min(100,s.hunger+15);s.mood=Math.min(100,s.mood+4);say('小波吃得飽飽的 🍙')}else if(a==='清潔'){s.clean=100;say('沖洗乾淨，亮晶晶 ✨')}else if(a==='睡眠'){s.night=!s.night;say(s.night?'夜深了…釣客真的站上來夜釣了！🎣':'早安！海邊又是新的一天 ☀️')}else if(a==='釣魚'){s.mood=Math.min(100,s.mood+8);say('釣到一條小魚！🐟 釣客友好度上升')}else if(a==='抗浪'){if(Math.random()<.45){s.dur=Math.max(15,s.dur-28);s.damaged=true;say('大浪捲起石頭！💥 小波出現裂縫！')}else{say('站穩了！成功擋住這波海浪 🌊✨')}}else if(a==='修補'){if(!s.damaged)say('目前沒有需要修補的裂縫～');else if(s.materials<=0)say('材料不足！先去取得水泥與骨材');else{s.materials--;workerNpc.classList.remove('hide');say('👷 工人正在填補裂縫與水泥養護…');setTimeout(()=>{s.dur=100;s.damaged=false;workerNpc.classList.add('hide');say('修補完成！小波恢復精神 ✨');render()},1400)}}else if(a==='倉庫')say(`🎒 修補材料 × ${s.materials}`);else say(`狀態：飽足${s.hunger}／心情${s.mood}／清潔${s.clean}／耐久${s.dur}`);render()}
function pressC(){s.sel=0;say('回到主畫面～');render()}render();setInterval(()=>{if(!s.night){s.hunger=Math.max(0,s.hunger-1);s.clean=Math.max(0,s.clean-1);render()}},30000);
</script></body></html>
