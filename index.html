<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4fc9d5"><title>消波塊寶寶 WaveBlock Baby v3.0</title><link rel="stylesheet" href="css/v3-world.css"></head><body>
<div class="app"><header class="topbar"><div><b>消波塊寶寶</b><small>WAVEBLOCK BABY · v3.0</small></div><div class="top-actions"><button id="mapButton">🗺️ 地圖</button><button id="bagButton">🎒 背包</button><button id="taskButton">📋 任務</button></div></header>
<section id="world" class="world" aria-label="海港大世界"><img class="world-art" src="assets/backgrounds/harbor-world.png" alt="消波塊寶寶海港大世界"><img id="pet" class="pet" src="assets/pet/waveblock-happy.svg" alt="消波塊寶寶"><div id="worldShade" class="world-shade"></div><div id="bubble" class="bubble">小波：「今天也要守護海岸！」</div><button id="fishingPier" class="hotspot pier" aria-label="釣魚碼頭"></button><button id="market" class="hotspot market" aria-label="海洋市集"></button><button id="breakwater" class="hotspot breakwater" aria-label="消波堤"></button><button id="coastPost" class="hotspot coast" aria-label="海巡站"></button><button id="craneZone" class="hotspot crane" aria-label="吊車區"></button></section>
<section id="hud" class="hud"><div class="stat"><span>🍙 飽足</span><b id="hungerText">80</b><i><em id="hungerBar"></em></i></div><div class="stat"><span>😊 心情</span><b id="happyText">85</b><i><em id="happyBar"></em></i></div><div class="stat"><span>✨ 清潔</span><b id="cleanText">100</b><i><em id="cleanBar"></em></i></div><div class="stat"><span>🔧 耐久</span><b id="durText">100</b><i><em id="durBar"></em></i></div></section>
<section id="actionDock" class="dock"><button data-action="feed"><strong>🍙</strong>餵食</button><button data-action="clean"><strong>🫧</strong>清潔</button><button data-action="fish"><strong>🎣</strong>釣魚</button><button data-action="wave"><strong>🌊</strong>抗浪</button><button data-action="repair"><strong>🛠️</strong>修補</button><button data-action="sleep"><strong>🌙</strong>睡眠</button><button data-action="inventory"><strong>🎒</strong>倉庫</button><button data-action="status"><strong>📊</strong>狀態</button></section>
<section class="mission"><div><small>今日任務</small><b id="missionText">和釣客一起釣 1 條魚</b></div><span id="dayText">DAY 1</span></section></div>
<div id="modal" class="modal" hidden><article><button id="modalClose" class="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></article></div><div id="toast" class="toast"></div>
<script src="js/state-v3.js"></script><script src="js/actions.js"></script><script src="js/visuals.js"></script><script src="js/world-events.js"></script><script src="js/game.js"></script></body></html>
