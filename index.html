<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>消波塊寶寶 v4.0</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a78bb">
<link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="css/v40-game.css"></head>
<body><div id="app">
<header><div><h1>消波塊寶寶 🌊</h1><small>WaveBlock Baby · HARBOR WORLD</small></div><b id="day">DAY 1 ☀️</b></header>
<section class="hud">
 <div>🍙 <span>飽足</span><progress id="hunger" max="100"></progress><b id="hungerN"></b></div>
 <div>😊 <span>心情</span><progress id="mood" max="100"></progress><b id="moodN"></b></div>
 <div>✨ <span>清潔</span><progress id="clean" max="100"></progress><b id="cleanN"></b></div>
 <div>🔧 <span>耐久</span><progress id="durability" max="100"></progress><b id="durabilityN"></b></div>
</section>
<main id="game-stage">
 <img class="world" src="assets/v40/harbor-world.png" alt="精緻海港世界">
 <button class="hotspot market" data-place="市集">海洋市集</button>
 <button class="hotspot pier" data-place="碼頭">釣魚碼頭</button>
 <button class="hotspot ocean" data-place="海洋">海洋朋友</button>
 <div id="pet" aria-label="小波"><span>●</span><span class="face">◕‿◕</span></div>
 <div id="speech">小波：「今天要去哪裡冒險？」</div>
 <div id="minigame" class="hidden"><div id="miniTitle"></div><div id="miniArena"></div><button id="miniTap">B！</button><button id="miniClose">返回</button></div>
</main>
<nav class="actions">
 <button data-action="feed">🍙<b>餵食</b></button><button data-action="clean">🫧<b>清潔</b></button><button data-action="fish">🎣<b>釣魚</b></button>
 <button data-action="wave">🌊<b>抗浪</b></button><button data-action="repair">🔨<b>修補</b></button><button data-action="sleep">🌙<b>睡眠</b></button>
</nav>
<section class="abc"><button id="btnA"><strong>A</strong><span>選擇</span></button><button id="btnB"><strong>B</strong><span>確定</span></button><button id="btnC"><strong>C</strong><span>返回</span></button></section>
<footer>v4.0 PLAYABLE · PWA</footer>
</div><script src="js/v40-game.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))</script></body></html>
